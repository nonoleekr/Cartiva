name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: cartiva_test
          POSTGRES_PASSWORD: cartiva_test_only
          POSTGRES_DB: cartiva_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U cartiva_test -d cartiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cartiva_test:cartiva_test_only@127.0.0.1:5435/cartiva_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
